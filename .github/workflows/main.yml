name: Build CruelKernel with KernelSU (No Magisk)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [ "N975F" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache clang flex \
          g++ gcc gcc-aarch64-linux-gnu git gnupg libelf-dev libncurses-dev \
          libssl-dev lld python3 unzip zstd

      - name: Fetch toolchains
        run: git submodule update --init --recursive --depth 1

      # Step 1: Configure with NODEFAULTS=1 and EXPLICITLY disable magisk
      - name: Kernel Configure (NO MAGISK)
        env:
          NODEFAULTS: "1"          # ← This disables ALL defaults (including magisk)
        run: |
          ./cruelbuild config                    \
                       model=${{ matrix.model }} \
                       name="Cruel-KSU"          \
                       -magisk                   \
                       +nohardening              \
                       +wireguard                \
                       +ttl                      \
                       +sdfat                    \
                       +1000hz                   \
                       os_patch_level=2099-12

      # Step 2: Confirm Magisk is OFF by inspecting generated config
      - name: Debug Show active config
        run: |
          echo "=== Generated config for ${{ matrix.model }} ==="
          cat ".config_cruel" || echo ".config_cruel not found"
          echo "=== End config ==="

      # Step 3: Apply KernelSU
      - name: Apply KernelSU (legacy 4.14/4.19)
        run: |
          git clone -b kernel-4.14-legacy https://github.com/tiann/KernelSU kernelsu
          cp -r kernelsu/kernel/* .

      # Step 4: Build
      - name: Build Kernel
        run: ./cruelbuild mkimg model=${{ matrix.model }}

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.model }}
          path: boot.img
